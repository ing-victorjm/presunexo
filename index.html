<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRESUNEXO — Presupuestos de obra</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='f' x1='0' y1='.15' x2='1' y2='.85'><stop offset='0' stop-color='%2326F4F4'/><stop offset='.55' stop-color='%234BA3D7'/><stop offset='1' stop-color='%236B71CE'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23f)'/><path d='M27 70L46 51L62 60L76 34' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='27' cy='70' r='8' fill='white'/><circle cx='46' cy='51' r='6.5' fill='white'/><circle cx='62' cy='60' r='6.5' fill='white'/><circle cx='76' cy='34' r='9' fill='white'/></svg>">
  <script>
    // Aplica el tema guardado antes del primer pintado para evitar parpadeo.
    try { if (localStorage.getItem('presunexo.tema') === 'oscuro') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <header id="topbar"></header>
    <main id="vista"></main>
  </div>
  <script type="module">
    // Guardado por cuenta: si el campus abrió la app con ?t=<token>, trae los
    // proyectos del servidor ANTES de cargar el estado local. Sin token o sin
    // red, la app sigue con el respaldo local de siempre.
    try {
      const t = new URLSearchParams(location.search).get('t');
      if (t) {
        sessionStorage.setItem('presunexo.token', t);
        const r = await fetch('/api/proyectos', { headers: { 'X-Token': t } });
        if (r.ok) {
          const d = await r.json();
          if (d && d.estado && Array.isArray(d.estado.proyectos) && d.estado.proyectos.length) {
            localStorage.setItem('presunexo.v1', JSON.stringify(d.estado));
          }
        }
      }
    } catch (e) { /* sin nube: continúa con lo local */ }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
