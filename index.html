<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRESUNEXO — Presupuestos de obra</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' font-weight='800' font-family='Arial' fill='white' text-anchor='middle'>P</text></svg>">
  <script>
    // Aplica el tema guardado antes del primer pintado para evitar parpadeo.
    try { if (localStorage.getItem('presunexo.tema') === 'oscuro') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <header id="topbar"></header>
    <main id="vista"></main>
  </div>
  <script type="module">
    // Guardado por cuenta: si el campus abrió la app con ?t=<token>, trae los
    // proyectos del servidor ANTES de cargar el estado local. Sin token o sin
    // red, la app sigue con el respaldo local de siempre.
    try {
      const t = new URLSearchParams(location.search).get('t');
      if (t) {
        sessionStorage.setItem('presunexo.token', t);
        const r = await fetch('/api/proyectos', { headers: { 'X-Token': t } });
        if (r.ok) {
          const d = await r.json();
          if (d && d.estado && Array.isArray(d.estado.proyectos) && d.estado.proyectos.length) {
            localStorage.setItem('presunexo.v1', JSON.stringify(d.estado));
          }
        }
      }
    } catch (e) { /* sin nube: continúa con lo local */ }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
